<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FC BRATVA — Premier League Tracker</title>
  <meta name="description" content="Official FC Bratva Premier Mobile League Portal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rajdhani:wght@600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=35">
  <!-- Three.js CDN for 3D Fabric Flag Animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- Real-time 3D Fabric Flag Background Canvas -->
<div id="bg-3d-canvas-container" class="bg-3d-canvas-container" aria-hidden="true"></div>

<div id="app">
  <div class="content-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <!-- 3D Waving Fabric Flag Logo (Frameless) with Instant Fallback -->
        <div id="flag-3d-header" class="brand-flag-3d" title="3D Fabric Flag (Click to Expand)">
          <img src="assets/fc-bratva-logo.png" alt="FC Bratva" class="flag-fallback-img" />
        </div>
        <div class="brand-details">
          <div class="brand-text-white">БРАТВА LEAGUE</div>
          <div class="brand-sub-text">PREMIER LEAGUE HUB</div>
        </div>
      </div>

      <div class="header-right">
        <!-- Audio / Music Toggle Button with Pro Vector Icon -->
        <button class="audio-btn" id="audio-toggle-btn" aria-label="Toggle Sound & Music" title="Sound & Music">
          <svg id="audio-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>

        <!-- Language Dropdown Selector with Tape -->
        <div class="lang-dropdown">
          <button class="lang-btn" id="lang-toggle-btn" aria-label="Select Language">
            <span id="current-lang-code" class="lang-code-text">EN</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="lang-menu" id="lang-menu">
            <button class="lang-opt active" data-lang="en"><img src="https://flagcdn.com/w20/us.png" alt="EN" width="20"> English</button>
            <button class="lang-opt" data-lang="ar"><img src="https://flagcdn.com/w20/sa.png" alt="AR" width="20"> العربية</button>
            <button class="lang-opt" data-lang="ru"><img src="https://flagcdn.com/w20/ru.png" alt="RU" width="20"> Русский</button>
            <button class="lang-opt" data-lang="es"><img src="https://flagcdn.com/w20/es.png" alt="ES" width="20"> Español</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <!-- TAB: DASHBOARD -->
      <section class="tab-page active" id="tab-dashboard">
        <div class="dashboard-grid">
          <!-- Column 1: League Overview & Recent Tournament -->
          <div class="dash-col">
            <!-- Hero League Summary Card -->
            <div class="note-card">
              <div class="card-title-bar">
                <div class="card-title" data-i18n="league_record">League Overview</div>
                <span id="hero-winrate-badge">0.0% WR</span>
              </div>

              <div class="metric-grid">
                <div class="metric-box">
                  <div class="metric-val green" id="hero-wins">0</div>
                  <div class="metric-lbl" data-i18n="wins">Wins</div>
                </div>
                <div class="metric-box">
                  <div class="metric-val" id="hero-draws">0</div>
                  <div class="metric-lbl" data-i18n="draws">Draws</div>
                </div>
                <div class="metric-box">
                  <div class="metric-val red" id="hero-losses">0</div>
                  <div class="metric-lbl" data-i18n="losses">Losses</div>
                </div>
              </div>
            </div>

            <!-- Recent Match Note -->
            <div class="note-card">
              <div class="card-title" data-i18n="recent_tournament">Recent Tournament</div>
              <div id="recent-match-container">
                <div style="text-align:center; padding:16px;" class="hand-text" data-i18n="loading">Loading...</div>
              </div>
            </div>
          </div>

          <!-- Column 2: Top Scorers (FC Mobile Player Cards) & Flagged -->
          <div class="dash-col">
            <!-- Top Scorer List -->
            <div class="note-card">
              <div class="card-title" data-i18n="top_performers">Top Scorers</div>
              <div id="top-performers-container" class="fc-player-cards-list"></div>
            </div>

            <!-- Flagged List -->
            <div class="note-card" id="flagged-card-box" style="display:none;">
              <div class="card-title" style="color: var(--loss-crimson);" data-i18n="flagged_players">Flagged Review</div>
              <div id="flagged-players-list"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB: TOURNAMENTS -->
      <section class="tab-page" id="tab-tournaments">
        <div class="note-card">
          <div class="card-title" data-i18n="tournament_history">Tournament History</div>
          <div id="tournaments-list-container"></div>
        </div>
      </section>

      <!-- TAB: ROSTER / PLAYERS -->
      <section class="tab-page" id="tab-players">
        <div class="note-card">
          <div class="card-title" data-i18n="nav_roster">League Roster</div>
          <input type="text" class="search-box" id="roster-search-input" placeholder="Search player..." />
          <div id="roster-cards-container" class="fc-player-cards-list"></div>
        </div>
      </section>

      <!-- TAB: LEADERBOARD -->
      <section class="tab-page" id="tab-leaderboard">
        <div class="filter-pills" style="margin-bottom: 16px;">
          <button class="filter-pill active" data-window="all" data-i18n="all_time">All Time</button>
          <button class="filter-pill" data-window="7" data-i18n="window_7d">7 Days</button>
          <button class="filter-pill" data-window="30" data-i18n="window_30d">30 Days</button>
        </div>

        <div class="note-card">
          <div class="card-title" data-i18n="nav_leaderboard">Player Standings</div>
          <div id="leaderboard-cards-container" class="fc-player-cards-list"></div>
        </div>
      </section>
    </main>
  </div> <!-- End content-wrapper -->

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-wrapper">
      <button class="close-tape" id="modal-close-x" aria-label="Close"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> ESC</button>
      <div class="modal-page" id="modal-page">
        <div id="modal-player-content"></div>
      </div>
    </div>
  </div>

  <!-- 3D Interactive Flag Modal -->
  <div class="modal-overlay" id="flag-modal">
    <div class="modal-wrapper" style="max-width: 520px; height: 80vh; max-height: 580px;">
      <button class="close-tape" id="flag-modal-close-x" aria-label="Close"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> ESC</button>
      <div class="modal-page" style="display:flex; flex-direction:column; padding: 18px 20px; overflow:hidden; height:100%;">
        <div class="card-title" style="margin-bottom: 12px; font-size: 1.15rem;">
          <span>БРАТВА — 3D FABRIC FLAG</span>
        </div>
        <div id="flag-modal-canvas-container" style="flex:1; width:100%; position:relative; border-radius:12px; overflow:hidden; background: radial-gradient(circle at center, #1c1033 0%, #080410 100%); border: 1px solid rgba(168, 85, 247, 0.25);"></div>
        <div class="hand-text" style="text-align:center; font-size:0.85rem; color:var(--text-muted); margin-top:10px; font-weight:600;">
          DRAG TO ROTATE 3D FABRIC FLAG
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Pro Gaming Dock) -->
  <nav class="nav-bar">
    <button class="nav-item active" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
      <span data-i18n="nav_dash">DASH</span>
    </button>
    <button class="nav-item" data-tab="tournaments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 5-3.5 9.5-7 10-3.5-.5-7-5-7-10V6l7-4z"></path><path d="M12 7v6"></path><circle cx="12" cy="15" r="1"></circle></svg>
      <span data-i18n="nav_tournaments">MATCHES</span>
    </button>
    <button class="nav-item" data-tab="players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span data-i18n="nav_roster">ROSTER</span>
    </button>
    <button class="nav-item" data-tab="leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>
      <span data-i18n="nav_leaderboard">RANKS</span>
    </button>
  </nav>

</div>

<svg style="width:0;height:0;position:absolute;">
  <defs>
    <!-- Filter for sketchy SVG lines -->
    <filter id="displacementFilter">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turbulence" />
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<script src="app.js?v=14"></script>
</body>
</html>
